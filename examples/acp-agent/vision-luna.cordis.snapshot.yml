# Keyless acceptance composition for vision-luna.cordis.yml. The scripted
# model boundary verifies that the DeepSeek parent receives no image block and
# that the Luna child receives the durable image plus structured-output tool.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@deepseek-ai/dsh-llm-deepseek'
        disabled: true

      - id: acp-agent
        name: '@deepseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.

      - insert:
          - id: attachment-local
            name: '@deepseek-ai/dsh-attachment-local'

          - id: jobs
            name: '@deepseek-ai/dsh-jobs-local'

          - id: vision-luna-model-fixture
            name: './tests/fixtures/vision-luna-model.ts'

          - id: tool-vision-luna
            name: '@deepseek-ai/dsh-tool-vision-luna'
            config:
              provider: zaizaizhao
              model: gpt-5.6-luna
              maxTokens: 4096
              maxDepth: 1
              maxConcurrency: 1
              enableRunInBackground: false
